name: Tests and security
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scanners
        run: python -m pip install bandit==1.8.6 ruff==0.14.3 detect-secrets==1.5.0
      - name: Python lint (correctness rules)
        run: ruff check --select E4,E7,E9,F check_apcups.py tests/
      - name: Bandit security analysis
        run: bandit -ll -r check_apcups.py
      - name: Secrets scan of tracked files
        shell: bash
        run: |
          git ls-files -z | xargs -0 detect-secrets scan > /tmp/secrets.json
          python - <<'PY'
          import json
          with open('/tmp/secrets.json', encoding='utf-8') as f:
              findings = json.load(f)['results']
          for path, matches in findings.items():
              for match in matches:
                  print(f"Potential secret: {path}:{match['line_number']} ({match['type']})")
          if findings:
              raise SystemExit('Potential secrets found; review before release')
          PY
